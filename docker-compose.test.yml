services:
  test-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: terceiroscr_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test-only
      MYSQL_ROOT_PASSWORD: test-root-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=test-only mysql -h 127.0.0.1 -u test terceiroscr_test -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
  tests:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: tests
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: test-db
      DB_DATABASE: terceiroscr_test
      DB_USERNAME: test
      DB_PASSWORD: test-only
      LOG_CHANNEL: stderr
    depends_on:
      test-db:
        condition: service_healthy
